[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-recon-harness"
version = "0.1.0"
description = "Deterministic harness for black-box GET-API reconnaissance — bounded LLM, verifiable reports"
authors = [{name = "Annamalai Narayanan"}]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "httpx",
    "pyyaml",
    "pydantic",
    "litellm",
    "openai",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
]

[project.scripts]
# Distinct entry points: headless CLI vs. the browser-driven web app.
api-recon = "api_recon_harness.interfaces.cli:main"
api-recon-web = "api_recon_harness.interfaces.server:main"

# Backend = the `api_recon_harness` package. Frontend = the top-level `frontend/`
# directory (a PROJECT_ROOT-relative resource, not package data); force-include
# keeps it in built artifacts so the server can still find frontend/index.html.
[tool.hatch.build]
packages = ["api_recon_harness"]
include = [
    "api_recon_harness/**/*.py",
    "api_recon_harness/*.yaml",
    "api_recon_harness/examples/*.json",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/index.html" = "frontend/index.html"

[tool.hatch.build.targets.sdist.force-include]
"frontend/index.html" = "frontend/index.html"
